<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".55"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0%" stop-color="#a78bfa" stop-opacity=".5"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="24"/></clipPath>
    <style>
      .t   { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .m   { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
      .blobA { animation: driftA 14s ease-in-out infinite alternate; }
      .blobB { animation: driftB 18s ease-in-out infinite alternate; }
      @keyframes driftA { to { transform: translate(120px, 40px); } }
      @keyframes driftB { to { transform: translate(-140px, -30px); } }
      .pkt { animation: dash 3.2s linear infinite; stroke-dasharray: 6 220; }
      .pkt.d2 { animation-delay: -1.1s; } .pkt.d3 { animation-delay: -2.2s; }
      @keyframes dash { from { stroke-dashoffset: 226; } to { stroke-dashoffset: 0; } }
      .node { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .node.n2 { animation-delay: .6s; } .node.n3 { animation-delay: 1.2s; } .node.n4 { animation-delay: 1.8s; }
      @keyframes pulse { 50% { transform: scale(1.35); opacity: .6; } }
      .role { opacity: 0; animation: cycle 12s infinite; }
      .r2 { animation-delay: 4s; } .r3 { animation-delay: 8s; }
      @keyframes cycle { 0%,2% { opacity: 0; transform: translateY(8px); } 6%,30% { opacity: 1; transform: none; } 34%,100% { opacity: 0; transform: translateY(-8px); } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .fade { animation: in 1s ease-out both; }
      @keyframes in { from { opacity: 0; transform: translateY(10px); } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle class="blobA" cx="220" cy="60"  r="260" fill="url(#glowA)"/>
    <circle class="blobB" cx="1000" cy="280" r="280" fill="url(#glowB)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- network topology, right side -->
    <g transform="translate(820 70)" stroke-width="2" fill="none">
      <path d="M40 90 L160 30 L290 80 L200 180 L40 90 L200 180" stroke="#94a3b8" stroke-opacity=".25"/>
      <path d="M160 30 L200 180" stroke="#94a3b8" stroke-opacity=".25"/>
      <path class="pkt"    d="M40 90 L160 30 L290 80"  stroke="#7dd3fc" stroke-linecap="round"/>
      <path class="pkt d2" d="M290 80 L200 180 L40 90" stroke="#a78bfa" stroke-linecap="round"/>
      <path class="pkt d3" d="M160 30 L200 180"        stroke="#f472b6" stroke-linecap="round"/>
      <g stroke="none">
        <circle class="node"    cx="40"  cy="90"  r="9" fill="#7dd3fc"/>
        <circle class="node n2" cx="160" cy="30"  r="9" fill="#a78bfa"/>
        <circle class="node n3" cx="290" cy="80"  r="9" fill="#f472b6"/>
        <circle class="node n4" cx="200" cy="180" r="9" fill="#34d399"/>
      </g>
    </g>

    <!-- text -->
    <g class="fade">
      <text x="72" y="92" class="m" font-size="18" fill="#64748b">~/jamshidkhaksaar <tspan fill="#34d399">$</tspan> whoami</text>
      <text x="70" y="160" class="t" font-size="58" font-weight="800" fill="url(#title)">Jamshid Khaksaar</text>
    </g>
    <g class="m" font-size="24" fill="#e2e8f0">
      <text x="72" y="214"><tspan fill="#7dd3fc">&gt;</tspan> </text>
      <text x="98" y="214" class="role">Network Administrator · MikroTik &amp; Sophos</text>
      <text x="98" y="214" class="role r2">Python &amp; Shell automation</text>
      <text x="98" y="214" class="role r3">Open-source enthusiast &amp; creator</text>
    </g>
    <rect class="cursor" x="72" y="236" width="14" height="4" fill="#7dd3fc"/>
    <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
